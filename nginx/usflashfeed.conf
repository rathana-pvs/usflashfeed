# ── Rate Limiting ──────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=usflashfeed_api:10m rate=20r/s;

upstream usflashfeed_upstream {
    server 127.0.0.1:3004;
    keepalive 64;
}

# ── HTTP Server (Supports Cloudflare Flexible + Direct HTTP) ───
server {
    listen 80;
    listen [::]:80;
    server_name usflashfeed.com www.usflashfeed.com;

    client_max_body_size 50M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # ── Serve uploaded media directly from disk ───────────────
    location /media/ {
        alias /var/www/usflashfeed/public/media/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri $uri/ @next_app;
    }

    # ── Cache static Next.js assets aggressively ─────────────
    location /_next/static/ {
        alias /var/www/usflashfeed/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Rate limit the Payload CMS API ────────────────────────
    location /api/ {
        limit_req zone=usflashfeed_api burst=30 nodelay;
        proxy_pass         http://usflashfeed_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 300s;
    }

    # ── Proxy to PM2 port 3004 ──────────────────────────────
    location / {
        proxy_pass         http://usflashfeed_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    location @next_app {
        proxy_pass         http://usflashfeed_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ── HTTPS Main Server ──────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name usflashfeed.com www.usflashfeed.com;

    client_max_body_size 50M;

    # SSL certificates
    ssl_certificate     /etc/letsencrypt/live/usflashfeed.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/usflashfeed.com/privkey.pem;

    # SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL_USFLASHFEED:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # ── Serve uploaded media directly from disk ───────────────
    location /media/ {
        alias /var/www/usflashfeed/public/media/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri $uri/ @next_app;
    }

    # ── Cache static Next.js assets aggressively ─────────────
    location /_next/static/ {
        alias /var/www/usflashfeed/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Rate limit the Payload CMS API ────────────────────────
    location /api/ {
        limit_req zone=usflashfeed_api burst=30 nodelay;
        proxy_pass         http://usflashfeed_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 300s;
    }

    # ── Proxy to PM2 (Next.js & Payload on Port 3004) ────────
    location / {
        proxy_pass         http://usflashfeed_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    location @next_app {
        proxy_pass         http://usflashfeed_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
